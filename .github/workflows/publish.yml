name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - 'v*'          # trigger on: git tag v0.0.2 && git push --tags

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Publish
        run: npx @vscode/vsce publish --allow-missing-repository
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
