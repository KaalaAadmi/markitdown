name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # required for Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx @vscode/vsce@latest publish --oidc
